# Konfigurace sestavení a publikování pro Netlify
[build]
  publish = "."       # Publikuje se kořenový adresář
  command = ""        # Statický web bez nutnosti build příkazu

# Nastavení cachování pro obrázky ve složce /foto/ pro maximální rychlost podle zadání
[[headers]]
  for = "/foto/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable" # Cachovat na 1 rok

# Hlavní bezpečnostní a výkonnostní hlavičky pro index.html
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    X-XSS-Protection = "1; mode=block"
    Referrer-Policy = "strict-origin-when-cross-origin"